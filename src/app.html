<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<!-- !important because the app stylesheet is linked after this block and would otherwise win. -->
		<noscript>
			<style>
				html:not([data-hydrated]) [data-needs-hydration] {
					pointer-events: auto !important;
					cursor: auto !important;
					opacity: 1 !important;
				}
				html:not([data-hydrated]) [data-needs-hydration]::after {
					display: none !important;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-theme="my-custom-theme" data-sveltekit-preload-data="hover">
		<div style="display: contents" class="h-full overflow-hidden">%sveltekit.body%</div>
	</body>
</html>
