# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - production
      - develop
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install
      - name: Deploy Firestore and Storage rules and Firestore indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEHMAN_REALTY }}'
          FB_PROJECT_ID: '${{ vars.FB_PROJECT_ID }}'
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          trap 'rm -f "$credentials"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" npx firebase deploy --only firestore,storage --project "$FB_PROJECT_ID" --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEHMAN_REALTY }}'
          channelId: live
          projectId: '${{ vars.FB_PROJECT_ID }}'
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          NODE_OPTIONS: '--max_old_space_size=4096'
          PUBLIC_FB_PROJECT_ID: '${{ vars.FB_PROJECT_ID }}'
          FB_CLIENT_EMAIL: '${{ secrets.FB_CLIENT_EMAIL }}'
          FB_PRIVATE_KEY: '${{ secrets.FB_PRIVATE_KEY }}'
          PUBLIC_FB_API_KEY: '${{ secrets.FB_API_KEY }}'
          PUBLIC_FB_AUTH_DOMAIN: '${{ secrets.FB_AUTH_DOMAIN }}'
          PUBLIC_FB_STORAGE_BUCKET: '${{ secrets.FB_STORAGE_BUCKET }}'
          PUBLIC_FB_MESSAGING_SENDER_ID: '${{ secrets.FB_MESSAGING_SENDER_ID }}'
          PUBLIC_FB_APP_ID: '${{ secrets.FB_APP_ID }}'
          PUBLIC_FB_MEASUREMENT_ID: '${{ secrets.FB_MEASUREMENT_ID }}'
          SENDGRID_API_KEY: '${{ secrets.SENDGRID_API_KEY }}'
          STRIPE_API_KEY: '${{ secrets.STRIPE_API_KEY }}'
          STRIPE_ENDPOINT_SECRET: '${{ secrets.STRIPE_ENDPOINT_SECRET }}'
          PUBLIC_FRONTEND_URL: '${{ vars.FRONTEND_URL }}'
