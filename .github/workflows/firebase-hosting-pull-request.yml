name: Perform development checks
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.pull_request.base.ref }}
    env:
      PUBLIC_FB_PROJECT_ID: '${{ vars.FB_PROJECT_ID }}'
      FB_CLIENT_EMAIL: '${{ secrets.FB_CLIENT_EMAIL }}'
      FB_PRIVATE_KEY: '${{ secrets.FB_PRIVATE_KEY }}'
      PUBLIC_FB_API_KEY: '${{ secrets.FB_API_KEY }}'
      PUBLIC_FB_AUTH_DOMAIN: '${{ secrets.FB_AUTH_DOMAIN }}'
      PUBLIC_FB_STORAGE_BUCKET: '${{ secrets.FB_STORAGE_BUCKET }}'
      PUBLIC_FB_MESSAGING_SENDER_ID: '${{ secrets.FB_MESSAGING_SENDER_ID }}'
      PUBLIC_FB_APP_ID: '${{ secrets.FB_APP_ID }}'
      PUBLIC_FB_MEASUREMENT_ID: '${{ secrets.FB_MEASUREMENT_ID }}'
      SENDGRID_API_KEY: '${{ secrets.SENDGRID_API_KEY }}'
      STRIPE_API_KEY: '${{ secrets.STRIPE_API_KEY }}'
      STRIPE_ENDPOINT_SECRET: '${{ secrets.STRIPE_ENDPOINT_SECRET }}'
      PUBLIC_FRONTEND_URL: '${{ vars.FRONTEND_URL }}'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install
      - name: Linter
        run: npm run lint
      - name: SvelteKit Check
        run: npm run check
      - name: Build production
        run: npm run build
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        id: tools-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Unit and handler tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Save the browser and emulator cache
        if: always() && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
